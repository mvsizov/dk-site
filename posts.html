<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daria Koroleva | Posts</title>
    <meta
      name="description"
      content="Записи и ссылки Дарьи Королёвой."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise-overlay"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar" id="top">
      <a class="brand" href="./index.html">
        <span class="brand-mark">DK</span>
        <span class="brand-name">daria koroleva</span>
      </a>
      <nav class="topbar-nav">
        <a href="./index.html">home</a>
        <a href="./work.html">work</a>
        <a href="./projects.html">projects</a>
        <a class="is-current" href="./posts.html">posts</a>
        <a href="./index.html#contact">contact</a>
      </nav>
    </header>

    <main>
      <section class="section reveal">
        <div class="section-head">
          <p class="eyebrow">posts</p>
          <h2>Заметки, ссылки, публикации</h2>
        </div>

        <div class="filter-bar" role="tablist" aria-label="Filter posts by source">
          <button type="button" class="filter-chip is-active" data-filter="all">all</button>
          <button type="button" class="filter-chip" data-filter="telegram">Telegram</button>
          <button type="button" class="filter-chip" data-filter="article">Article</button>
        </div>

        <div class="post-list" id="post-list">
          <!-- Posts will appear here. -->
        </div>

        <div class="empty-state" id="post-empty">
          <p class="eyebrow">work in progress</p>
          <p class="empty-copy">
            Записи появятся здесь — короткие заметки и ссылки на статьи и
            публикации.
          </p>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
